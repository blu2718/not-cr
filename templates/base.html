<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}not-cr{% endblock %}</title>
    <script>
        (() => {
            try {
                const saved = localStorage.getItem("not-cr-theme");
                const dark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
                if (dark) document.documentElement.dataset.theme = "dark";
            } catch (_error) {}
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}" defer></script>
    {% block head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="{{ url_for('index') }}">not-cr</a>
            <nav aria-label="Navegación principal">
                <a href="{{ url_for('index') }}">Documentos</a>
                <a href="{{ url_for('config_page') }}">Configuración</a>
                <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Activar modo oscuro">Modo oscuro</button>
            </nav>
        </div>
    </header>
    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-stack">
                    {% for category, message in messages %}
                        <div class="flash flash--{{ category }}" role="status">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
